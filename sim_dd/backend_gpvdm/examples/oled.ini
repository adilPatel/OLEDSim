# examples/oled.ini - three-layer OLED (HTL / emissive / ETL) demonstrating
# every model in the simulator:
#   - heterojunction band offsets between layers
#   - thermionic (Scott-Malliaras) injection at the anode, ohmic-np cathode
#   - Langevin recombination in the emissive layer
#   - exponential tail traps with dynamic SRH bands in the emissive layer
#   - Poole-Frenkel field-dependent mobility in the transport layers
#   - transfer-matrix outcoupling of the recombination-zone emission
#
# Run from backend_gpvdm/:   ./oled_sim examples/oled.ini

[simulation]
T = 300
voltage_start = 0.0
voltage_stop = 4.0
voltage_step = 0.1
points_per_layer = 60
newton_tol = 1e-9
max_newton_steps = 500
newton_clamp = 4.0
output_dir = output_oled

[layer htl]
thickness = 40e-9
Eg = 3.0
Xi = 2.0            # LUMO 2.0 eV below vacuum, HOMO at 5.0 eV
epsilon_r = 3.5
Nc = 1e26
Nv = 1e26
statistics = boltzmann
mobility_model_e = poole_frenkel
mobility_model_h = poole_frenkel
mun = 1e-9
mup = 1e-8
pf_gamma_e = 3e-4
pf_gamma_h = 3e-4
recomb_model = constant_b
B = 0.0
trap_model_e = none
trap_model_h = none

[layer emissive]
thickness = 30e-9
Eg = 2.4
Xi = 2.3            # LUMO 2.3, HOMO 4.7: both carriers fall into this layer
epsilon_r = 3.0
Nc = 1e26
Nv = 1e26
statistics = boltzmann
mun = 5e-9
mup = 5e-9
recomb_model = langevin
langevin_pre = 1.0
trap_model_e = exponential
trap_model_h = exponential
trap_Nt_e = 1e23
trap_Nt_h = 1e23
trap_Et_e = 0.05
trap_Et_h = 0.05
srh_bands = 5
srh_start = -0.6
srh_sigman_e = 1e-20
srh_sigmap_e = 1e-22
srh_sigman_h = 1e-22
srh_sigmap_h = 1e-20
srh_vth = 1e5

[layer etl]
thickness = 40e-9
Eg = 3.1
Xi = 1.9            # LUMO 1.9, HOMO 5.0: blocks holes, injects electrons
epsilon_r = 3.5
Nc = 1e26
Nv = 1e26
statistics = boltzmann
mobility_model_e = poole_frenkel
mobility_model_h = poole_frenkel
mun = 1e-8
mup = 1e-9
pf_gamma_e = 3e-4
pf_gamma_h = 3e-4
recomb_model = constant_b
B = 0.0
trap_model_e = none
trap_model_h = none

[contact_anode]
model = thermionic
majority = hole
barrier = 0.35       # ITO/PEDOT-like hole injection barrier into the HTL HOMO

[contact_cathode]
model = ohmic-np
majority = electron
np = 1e25            # LiF/Al-like ohmic electron contact

[outcoupling]
enabled = 1
optical_stack = examples/oled_optical_stack.txt
emission_layer = emissive
lam_start = 450e-9
lam_stop = 700e-9
lam_points = 26
mesh_points = 1500
