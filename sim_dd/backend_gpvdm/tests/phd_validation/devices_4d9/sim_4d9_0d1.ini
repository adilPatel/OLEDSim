# F8BT 100 nm EGDM - PhD TCAD validation
#   anode 4.9 eV (thermionic), cathode 2.9 eV (ohmic), mu0n = 0.1 cm2/Vs
# Generated by ../make_decks.py; see that file for the parameter provenance.

[simulation]
T = 300
voltage_start = 0.0
voltage_stop = 10.0
voltage_step = 0.1
points_per_layer = 100
newton_tol = 1e-9
newton_tol_relaxed = 1e-6
max_newton_steps = 500
newton_clamp = 4.0
output_dir = out_4d9_0d1

[layer f8bt]
thickness = 1e-07
Eg = 2.6
Xi = 3.3
epsilon_r = 3.0
Nc = 1.000000e+27
Nv = 1.000000e+27
statistics = gaussian
dos_sigma_e = 0.15
dos_sigma_h = 0.15

mobility_model_e = egdm
mobility_model_h = egdm
mun = 5.555556e+03
mup = 5.555556e+03
egdm_sigma_e = 0.15
egdm_sigma_h = 0.15
egdm_a_e = 1.000000e-09
egdm_a_h = 1.000000e-09
egdm_Nt_e = 1.000000e+27
egdm_Nt_h = 1.000000e+27

recomb_model = langevin
langevin_pre = 0.1

# electron tail traps: total N_T = 7.5e17 cm^-3 (T_t = 780 K).
# trap_Nt_e is the tail DOS PREFACTOR [m^-3 eV^-1]; the total is
# trap_Nt_e * trap_Et_e, so the prefactor below is N_T / Et.
trap_model_e = exponential
trap_Nt_e = 1.115819e+25
trap_Et_e = 0.067215
trap_model_h = none
srh_bands = 8
srh_start = -0.8
srh_sigman_e = 1e-20
srh_sigmap_e = 1e-20
srh_vth = 1e5

[contact_anode]
majority = hole
model = thermionic
barrier = 1.000

[contact_cathode]
model = ohmic-np
majority = electron
np = 5.000000e+26

[outcoupling]
enabled = 0
