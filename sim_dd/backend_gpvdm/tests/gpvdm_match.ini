# tests/gpvdm_match.ini - device matched 1:1 to the gpvdm reference built by
# make_gpvdm_ref.py (gpvdm's default material, made explicit):
# single 100nm layer, Xi=1.6 Eg=1.2 eps_r=5, Nc=Nv=5e25, mue=muh=1e-5,
# B=0, exponential traps Nt=1e20 m^-3 eV^-1, Et=60meV, 5 SRH bands over
# [-0.5,0] eV, gpvdm default capture cross sections, vth=1e5.
# Ohmic contacts np=1e25: hole anode (driven), electron cathode (ground).

[simulation]
T = 300
voltage_start = 0.0
voltage_stop = 2.0
voltage_step = 0.05
points_per_layer = 100
newton_tol = 1e-10
max_newton_steps = 500
newton_clamp = 4.0
output_dir = out_gpvdm_match

[layer active]
thickness = 100e-9
Eg = 1.2
Xi = 1.6
epsilon_r = 5.0
Nc = 5e25
Nv = 5e25
statistics = boltzmann
mun = 1e-5
mup = 1e-5
recomb_model = constant_b
B = 0.0
trap_model_e = exponential
trap_model_h = exponential
trap_Nt_e = 1e20
trap_Nt_h = 1e20
trap_Et_e = 0.06
trap_Et_h = 0.06
srh_bands = 5
srh_start = -0.5
srh_sigman_e = 2.131895e-21  # gpvdm: electron traps capture e with sigman_e
srh_sigmap_e = 3.142822e-22
srh_sigman_h = 3.142822e-22  # hole traps: swapped (gpvdm srhsigman_h/srhsigmap_h)
srh_sigmap_h = 2.131895e-21
srh_vth = 1e5

[contact_anode]
model = ohmic-np
majority = hole
np = 1e25

[contact_cathode]
model = ohmic-np
majority = electron
np = 1e25

[outcoupling]
enabled = 0
