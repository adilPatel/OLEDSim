# tlc_traps.ini - trap-limited current (TCLC) test device.
#
# PURPOSE
#   Verify that the simulator reproduces Mark-Helfrich trap-limited
#   space-charge-limited current for an exponential trap distribution:
#
#       J  ~  V^(l+1) / L^(2l+1),      l = Tt/T = Et/(kT)
#
#   i.e. a log-log J-V slope of l+1, versus the trap-free Mott-Gurney slope
#   of exactly 2.  The companion deck tlc_trapfree.ini is the same device
#   with the traps removed, and is the slope-2 control.
#
# DEVICE
#   Single-layer, electron-only.  The cathode is ohmic for electrons (zero
#   injection barrier) and the anode presents a 1.0 eV barrier to holes, so
#   the hole population is ~10^17 lower than the electron population and the
#   current is carried by electrons alone - which is the regime the
#   Mark-Helfrich analysis describes.
#
#   Constant (field- and density-independent) mobility, as required: any
#   field dependence would contaminate the measured slope with its own
#   voltage dependence.
#
# TRAPS
#   Exponential tail below the LUMO, on the ELECTRON side only
#   (trap_model_h = none).
#
#     Et = 0.075 eV  =  kB * 870 K   ->  l = Et/kT = 2.901 at 300 K
#     predicted TCLC slope = l + 1 = 3.90
#
#   trap_Nt_e is the tail PREFACTOR in m^-3 eV^-1 (dos.c:trap_rho returns
#   Nt*exp(E/Et)); the integrated trap density is
#       int_-inf^0 Nt exp(E/Et) dE = Nt * Et.
#   Here Nt = 4.0e25 m^-3 eV^-1  ->  Ntotal = Nt*Et = 3.0e24 m^-3, a
#   realistic organic trap density.
#
#   This density matters in BOTH directions and was chosen by a scan:
#     * too few traps (Ntotal <~ 3e23) and the traps fill as the bias rises,
#       theta -> 1 and the device reverts to trap-free Mott-Gurney (slope 2);
#     * too many traps (Ntotal >~ 1e25) and the trap quasi-Fermi level is
#       pinned so deep in the tail that it leaves the exponential region the
#       Mark-Helfrich derivation assumes, and the slope falls back toward 2
#       again (measured 3.06 at 3e25).
#   3e24 m^-3 sits at the centre of the trap-limited plateau: the measured
#   slope is 3.91 against the predicted 3.90.
#
#   srh_start = -0.5 eV is 6.7*Et, capturing >99.8% of the tail without
#   pushing the deepest band's occupancy into underflow.
#
# TRAP KINETICS
#   trap_kinetics = srh (the default, gpvdm's model): each band carries its
#   own quasi-Fermi level.  Mark-Helfrich assumes the traps are in
#   equilibrium with the free carriers, which the SRH balance reproduces
#   automatically here because there is no second carrier to make the traps
#   a recombination path (p is negligible), so the capture/emission balance
#   for electrons alone pins xt to xn.
#
# RECOMBINATION
#   Langevin, as requested.  With p ~ 10^17 x smaller than n the bimolecular
#   term is numerically irrelevant to J, but it is the physically correct
#   choice for an organic device and is what would take over if the hole
#   barrier were lowered.

[simulation]
T = 300
voltage_start = 0.0
voltage_stop = 12.0
voltage_step = 0.05
points_per_layer = 160
newton_tol = 1e-10
newton_tol_relaxed = 1e-7
max_newton_steps = 600
newton_clamp = 4.0
output_dir = tests/trap_limited/out_traps

[layer emissive]
thickness = 200e-9
Eg = 2.5
Xi = 3.0             # LUMO 3.0 eV, HOMO 5.5 eV below vacuum
epsilon_r = 3.0
Nc = 1e25
Nv = 1e25
statistics = boltzmann

# constant mobility - no field or density dependence
mobility_model_e = constant
mobility_model_h = constant
mun = 1e-9
mup = 1e-11          # holes are blocked anyway; kept small and finite

recomb_model = langevin
langevin_pre = 1.0

# ---- exponential electron traps -------------------------------------------
trap_model_e = exponential
trap_model_h = none
trap_Nt_e = 4.0e25        # prefactor -> Ntotal = Nt*Et = 3e24 m^-3
trap_Et_e = 0.075         # = kB * 870 K  ->  l = 2.901, slope = 3.90
srh_bands = 10
srh_start = -0.5          # 6.7*Et below the LUMO
srh_sigman_e = 1e-20      # electron capture into an electron trap
srh_sigmap_e = 1e-22      # hole capture (the slow, minority channel)
srh_vth = 1e5

[contact_anode]
# High hole barrier: this is the blocking contact that makes the device
# electron-only.  1.0 eV below the HOMO edge suppresses p by exp(-1.0/kT).
model = ohmic-barrier
majority = hole
barrier = 1.0

[contact_cathode]
# Ohmic electron contact: zero injection barrier, so the cathode supplies
# the space charge reservoir and never limits the current.
model = ohmic-np
majority = electron
np = 1e25            # = Nc, i.e. a zero-barrier ohmic contact

[outcoupling]
enabled = 0
