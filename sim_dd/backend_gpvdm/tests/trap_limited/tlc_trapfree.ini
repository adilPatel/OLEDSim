# tlc_trapfree.ini - trap-FREE control for tlc_traps.ini.
#
# Identical device in every respect (same L, Nc, mobility, contacts, Langevin
# recombination) except trap_model_e = none.  This is the slope-2
# Mott-Gurney reference the trap-limited deck is measured against:
#
#     J_MG = (9/8) eps_r eps_0 mu V^2 / L^3
#
# With eps_r=3, mun=1e-9 m^2/Vs, L=200nm:  J_MG = 3.73 * V^2  A/m^2.

[simulation]
T = 300
voltage_start = 0.0
voltage_stop = 12.0
voltage_step = 0.05
points_per_layer = 160
newton_tol = 1e-10
newton_tol_relaxed = 1e-7
max_newton_steps = 600
newton_clamp = 4.0
output_dir = tests/trap_limited/out_trapfree

[layer emissive]
thickness = 200e-9
Eg = 2.5
Xi = 3.0             # LUMO 3.0 eV, HOMO 5.5 eV below vacuum
epsilon_r = 3.0
Nc = 1e25
Nv = 1e25
statistics = boltzmann

# constant mobility - no field or density dependence
mobility_model_e = constant
mobility_model_h = constant
mun = 1e-9
mup = 1e-11          # holes are blocked anyway; kept small and finite

recomb_model = langevin
langevin_pre = 1.0

# ---- exponential electron traps -------------------------------------------
trap_model_e = none
trap_model_h = none
trap_Nt_e = 4.0e25        # prefactor -> Ntotal = Nt*Et = 3e24 m^-3
trap_Et_e = 0.075         # = kB * 870 K  ->  l = 2.901, slope = 3.90
srh_bands = 10
srh_start = -0.5          # 6.7*Et below the LUMO
srh_sigman_e = 1e-20      # electron capture into an electron trap
srh_sigmap_e = 1e-22      # hole capture (the slow, minority channel)
srh_vth = 1e5

[contact_anode]
# High hole barrier: this is the blocking contact that makes the device
# electron-only.  1.0 eV below the HOMO edge suppresses p by exp(-1.0/kT).
model = ohmic-barrier
majority = hole
barrier = 1.0

[contact_cathode]
# Ohmic electron contact: zero injection barrier, so the cathode supplies
# the space charge reservoir and never limits the current.
model = ohmic-np
majority = electron
np = 1e25            # = Nc, i.e. a zero-barrier ohmic contact

[outcoupling]
enabled = 0
