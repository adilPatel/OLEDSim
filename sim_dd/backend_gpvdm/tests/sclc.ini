# tests/sclc.ini - hole-only space-charge-limited-current device.
#
# Validation: trap-free single-carrier device with ohmic contacts follows
# the Mott-Gurney law  J = (9/8) eps mu V^2 / L^3.
# With eps_r=3, mup=1e-10 m2/Vs, L=100nm:  J = 2.988 * V^2  A/m^2.
# Drift-diffusion converges on this from above as V >> kT/q (diffusion adds
# current at low V).

[simulation]
T = 300
voltage_start = 0.5
voltage_stop = 5.0
voltage_step = 0.25
points_per_layer = 100
newton_tol = 1e-10
max_newton_steps = 400
newton_clamp = 4.0
output_dir = out_sclc

[layer transport]
thickness = 100e-9
Eg = 3.0
Xi = 2.0
epsilon_r = 3.0
Nc = 1e26
Nv = 1e26
statistics = boltzmann
mun = 1e-10
mup = 1e-10
recomb_model = constant_b
B = 0.0
trap_model_e = none
trap_model_h = none

[contact_anode]
model = ohmic-np
majority = hole
np = 1e26

[contact_cathode]
model = ohmic-np
majority = hole
np = 1e26

[outcoupling]
enabled = 0
