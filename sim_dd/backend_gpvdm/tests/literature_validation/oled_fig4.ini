# oled_fig4.ini - Knapp et al., J. Appl. Phys. 108, 054504 (2010), Fig. 4.
#
# Single-carrier device, EGDM transport, no traps.  The figure shows J-V for
# four injection barriers (Delta = 0, 0.33, 0.67, 1.0 eV) over 0.01-1 V.
#
# Quoted parameters:
#   N0        = 2.44e26 m^-3   site density
#   mu0       = 1.1e-16 m^2/Vs zero-field, low-density mobility
#   sigma/kT  = 6              disorder, as a ratio
#   L         = 22 nm
#
# Derived:
#   The paper states room temperature: T = 300K, so sigma = 6*kT =
#   0.155112 eV.  (sigma/kT is fixed at 6, so the EGDM mu0 prefactor
#   c1*exp(-c2*sh^2) = 4.883598e-16 is independent of this choice.)
#   egdm_a = N0^(-1/3) = 1.6003 nm (site spacing must match N0).
#   mun/mup: the deck takes the EGDM mu0 PREFACTOR, not the mobility
#     (mobility.c: egdm_mu):
#       mu(T, F->0, n->0) = mun * 1.8e-9 * exp(-0.42*sigma_hat^2)
#     with sigma_hat = 6 the factor is 4.883598e-16, so
#       mun = 1.1e-16 / 4.883598e-16 = 0.2252437.
#
# Contacts.  The figure has NO built-in potential - the curves are smooth
# power laws through the whole range with no turn-on knee - so both contacts
# sit at the same work function and Delta is the barrier at BOTH.  The paper
# does not say which carrier; "single carrier device" is realised here as
# hole-only (both contacts hole-majority), matching Fig. 6's orientation.
#
# The maximum reduced field is q*a*F/sigma = 0.48 at 1V across 22nm, well
# inside Pasveer's fitted range, so no field clamp is needed (contrast the
# 129nm/100V device of Fig. 6).
#
# The barrier is set by the plotting script (plot_fig4.py), which rewrites
# the two contact blocks per curve.

[simulation]
T = 300
voltage_start = 0.0
voltage_stop = 1.0
voltage_step = 0.002
points_per_layer = 200
newton_tol = 1e-12
newton_tol_relaxed = 1e-10
max_newton_steps = 500
newton_clamp = 4.0
output_dir = output_fig4

[layer emissive]
thickness = 22e-9
Eg = 2.6
Xi = 3.0
epsilon_r = 3.0
Nc = 2.44e26
Nv = 2.44e26
statistics = gaussian
dos_sigma_e = 0.155112
dos_sigma_h = 0.155112
mobility_model_e = egdm
mobility_model_h = egdm
mun = 0.2252437      # EGDM prefactor -> mu0 = 1.1e-16 m^2/Vs at sigma/kT=6
mup = 0.2252437
egdm_sigma_e = 0.155112
egdm_sigma_h = 0.155112
egdm_a_e = 1.6003e-9 # N0^(-1/3) for N0 = 2.44e26 m^-3
egdm_a_h = 1.6003e-9

# Single-carrier device: no second carrier to recombine with, and no traps.
recomb_model = constant_b
B = 0.0
trap_model_e = none
trap_model_h = none

[contact_anode]
model = ohmic-np
majority = hole
np = 1.22e26

[contact_cathode]
model = ohmic-np
majority = hole
np = 1.22e26

[outcoupling]
enabled = 0
