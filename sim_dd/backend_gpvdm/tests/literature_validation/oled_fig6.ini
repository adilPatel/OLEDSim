# oled_fig6.ini - Knapp et al., J. Appl. Phys. 108, 054504 (2010), Fig. 6.
# Trapped case (see oled_fig6_trapfree.ini for the trap-free companion).
#
# Hole-only single-layer device with EGDM mobility and an exponential trap
# distribution.  Parameters as quoted for the figure:
#   L        = 129 nm
#   T        = 293 K
#   phiB     = 0.3 eV (injection barrier at the injecting contact)
#   N0       = 1e27 m^-3 (site density)
#   sigma    = 0.07 eV (EGDM disorder parameter)
#   mu0      = 1e-9 m^2/Vs (zero-field, low-density mobility at 293K)
#   Vbi      = 0.9 V
#   Ntrap    = 1e24 m^-3
#   T_trap   = 2100 K
#
# Derived quantities:
#   trap_Et_e = kB * 2100K = 0.18096 eV  (exponential tail slope)
#   egdm_a    = N0^(-1/3) = 1.0 nm       (site spacing must match N0)
#   mun/mup: the deck takes the EGDM mu0 *prefactor*, not the mobility
#     itself (mobility.c: egdm_mu):
#       mu(T,F->0,n->0) = mun * 1.8e-9 * exp(-0.42 * sigma_hat^2)
#     with sigma_hat = sigma/kT = 2.7724 at 293K the factor is 7.13297e-11,
#     so mun = 1e-9 / 7.13297e-11 = 14.0194 gives mu0 = 1e-9 m^2/Vs.
#   Vbi = 0.9V is set by the contact work-function difference: the anode
#     sits 0.3eV above the HOMO, the cathode 0.9V below that, i.e. a 1.2eV
#     barrier to hole injection from the cathode side.  Both contacts are
#     hole-majority, so the device is hole-only as in the paper, and the
#     traps sit on the transported carrier.
#
# The sweep is logarithmic in the figure (1e-2 to 1e2 V); this deck sweeps
# linearly and the plotting script (plot_fig6.py) renders it on log axes.

[simulation]
T = 293
voltage_start = 0.0
voltage_stop = 100.0
voltage_step = 0.05
points_per_layer = 100
newton_tol = 1e-9
newton_tol_relaxed = 1e-6
max_newton_steps = 500
newton_clamp = 4.0
output_dir = output_fig6_traps

[layer emissive]
thickness = 129e-9
Eg = 2.6
Xi = 3.0
epsilon_r = 3.0
Nc = 1e27
Nv = 1e27
statistics = gaussian
dos_sigma_e = 0.07
dos_sigma_h = 0.07
mobility_model_e = egdm
mobility_model_h = egdm
mun = 14.0194        # EGDM prefactor -> mu0 = 1e-9 m^2/Vs at 293K
mup = 14.0194
egdm_sigma_e = 0.07
egdm_sigma_h = 0.07
egdm_a_e = 1.0e-9    # N0^(-1/3) for N0 = 1e27 m^-3
egdm_a_h = 1.0e-9
egdm_f_clamp = 2.0   # cap the reduced field q*a*F/sigma at Pasveer's fitted
                     # limit; beyond ~18V in this device g2 is extrapolated
# Recombination.  Knapp et al. model a single-carrier (hole-only) device, so
# there is no electron population to recombine with and no recombination of
# any kind: B = 0 here, and trap_kinetics = equilibrium removes the
# trap-assisted channel (traps share the free holes' quasi-Fermi level, so
# trapped charge enters Poisson only while the drift-diffusion currents and
# continuity equations carry free carriers alone).
#
# On Langevin in this device: setting recomb_model = langevin also selects
# equilibrium traps by default, and it gives J identical to B=0 to 5-6 digits
# over the whole range it completes - but it only reaches 34.75V, not 100V.
# The reason is physical, not numerical.  Langevin makes R = B(np - neq peq)
# a net ELECTRON sink of ~3e12 m^-3 s^-1 in the bulk, yet both contacts are
# hole-majority so nothing injects electrons to feed it.  The sink demands
# ~3x more electron flux than drift at n ~ 4e5 can supply, so the electron
# continuity equation is strained to the point where Newton can no longer
# converge.  A single-carrier device should carry no bimolecular term at all;
# B = 0 is the correct statement of the model, not a workaround.
recomb_model = constant_b
B = 0.0
trap_kinetics = equilibrium
trap_model_e = none
trap_model_h = exponential
# trap_Nt_h is the exponential-tail PREFACTOR in m^-3 eV^-1 (dos.c:trap_rho
# returns Nt*exp(E/Et)), whereas the paper quotes Ntrap = 1e24 m^-3 as the
# TOTAL integrated trap density.  The two are related by
#     int_-inf^0 Nt exp(E/Et) dE = Nt * Et,
# so the prefactor that reproduces the quoted total is Ntrap/Et:
#     1e24 / 0.180964 = 5.526e24 m^-3 eV^-1.
trap_Nt_h = 5.525961e24
trap_Et_h = 0.180964 # kB * 2100K
# srh_start must bracket the tail without reaching so deep that the
# deepest band's occupancy underflows (>= ~1.2eV fails to converge).
# Et = 0.181eV, so -0.9eV is ~5*Et and captures >99% of the tail.
srh_bands = 8
srh_start = -0.9
srh_sigman_h = 1e-22
srh_sigmap_h = 1e-20
srh_vth = 1e5

[contact_anode]
# Ohmic (non-limiting) injection: the measurement is space-charge limited,
# so the injecting contact must not be the bottleneck.  np is the Gaussian
# DOS occupancy at the quoted 0.3eV barrier (N0=1e27, sigma=0.07eV, 293K),
# so the barrier and hence Vbi=0.9V are preserved while injection itself is
# no longer field- or current-limited.
model = ohmic-np
majority = hole
np = 2.9003e23       # = D(EF = -0.3eV) for this Gaussian DOS

[contact_cathode]
model = thermionic
majority = hole
barrier = 1.2        # 0.3 + Vbi(0.9) -> hole-only device

[outcoupling]
enabled = 0
